services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: career_digest
      POSTGRES_PASSWORD: career_digest
      POSTGRES_DB: career_digest
    ports:
      - "5432:5432"
    volumes:
      - career_digest_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_digest"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  career_digest_pg:
