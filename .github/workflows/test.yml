name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: career_digest
          POSTGRES_PASSWORD: career_digest
          POSTGRES_DB: career_digest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U career_digest -d career_digest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://career_digest:career_digest@localhost:5432/career_digest_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests (API)
        run: npm run test -w @career-digest/api

      - name: Build web
        run: npm run build -w @career-digest/web
